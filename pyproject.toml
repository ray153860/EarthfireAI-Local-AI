[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthfireai-local-ai"
version = "0.1.0"
description = "Local-first Ollama client used by EarthfireAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
earthfire-local-ai = "earthfireai_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
